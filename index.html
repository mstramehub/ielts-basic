<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Basic · Ms Trâm English Hub</title>
<meta name="description" content="IELTS Basic – lộ trình tiếng Anh nền tảng của Ms Trâm English Hub: phát âm, từ vựng, ngữ pháp và các kỹ năng Nghe, Đọc, Nói, Viết.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gentium+Book+Plus:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/gate.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<script src="assets/gate.js"></script>
<div class="shell">
  <main class="hub-main" id="main"></main>
</div>
<script src="assets/core.js"></script>
<script>
/* ===== DANH SÁCH MỤC — đổi ready:true và thêm path khi có nội dung mới ===== */
const MODULES=[
 {id:'phat-am',ready:true,path:'phat-am/',icon:'/ə/',title:'Phát âm',desc:'Bảng IPA 44 âm, từ hay đọc sai, đuôi -s/-es, -ed, cặp âm dễ nhầm.',count:'6 dạng bài luyện · 166 câu dictation'},
 {id:'tu-vung',ready:true,path:'tu-vung/',icon:'Aa',title:'Từ vựng',desc:'Từ vựng theo chủ đề IELTS Speaking Part 1, có phiên âm, nghĩa và câu ví dụ.',count:'6 chủ đề · 72 từ · flashcard và 3 dạng bài'},
 {id:'ngu-phap',ready:true,path:'ngu-phap/',icon:'S+V',title:'Ngữ pháp',desc:'Các thì cơ bản, tương lai, so sánh, danh từ đếm được và không đếm được.',count:'6 bài · 48 câu trắc nghiệm'},
 {id:'nghe',ready:false,icon:'◖◗',title:'Nghe',desc:'Nghe hiểu hội thoại ngắn, điền thông tin, chọn đáp án.'},
 {id:'doc',ready:false,icon:'¶',title:'Đọc',desc:'Đọc hiểu đoạn văn ngắn, True / False / Not Given, tìm ý chính.'},
 {id:'noi',ready:false,icon:'“ ”',title:'Nói',desc:'Câu hỏi IELTS Speaking Part 1–2 kèm câu trả lời mẫu.'},
 {id:'viet',ready:false,icon:'✎',title:'Viết',desc:'Viết câu, đoạn văn ngắn, email cơ bản.'}
];
const PLAN=[
 ['Tuần 1–2','Phát âm: bảng IPA, cặp âm dễ nhầm','Từ vựng: Family & Friends, Hometown','Ngữ pháp: Hiện tại đơn, Hiện tại tiếp diễn'],
 ['Tuần 3–4','Phát âm: đuôi -s/-es, -ed','Từ vựng: Daily routine, Free time & Hobbies','Ngữ pháp: Quá khứ đơn, Tương lai'],
 ['Tuần 5–6','Phát âm: từ hay đọc sai, dictation đoạn văn','Từ vựng: Food & Drink, Study & Work','Ngữ pháp: So sánh, Much / many / some / any']
];
chrome({active:'home',lead:'Lộ trình tiếng Anh nền tảng cho học viên mới bắt đầu IELTS. Chọn một mục bên dưới để học.'});
(window.__GATE||Promise.resolve()).then(()=>{
  const main=document.getElementById('main');
  const card=m=>m.ready
    ? h('a',{class:'mod',href:m.path},h('span',{class:'ic'},m.icon),h('h3',{},m.title),h('p',{},m.desc),h('span',{class:'badge'},m.count),h('span',{class:'go'},'Vào học →'))
    : h('div',{class:'mod soon'},h('span',{class:'ic'},m.icon),h('h3',{},m.title),h('p',{},m.desc),h('span',{class:'badge soon'},'Sắp cập nhật'));
  main.append(
    h('section',{style:'display:grid;gap:12px'},h('div',{class:'head'},h('h2',{},'Kiến thức nền tảng'),h('p',{},'Ba mục học trước: phát âm đúng, có vốn từ và nắm chắc ngữ pháp cơ bản.')),
      h('div',{class:'modgrid'},...MODULES.filter(m=>['phat-am','tu-vung','ngu-phap'].includes(m.id)).map(card))),
    h('section',{style:'display:grid;gap:12px'},h('div',{class:'head'},h('h2',{},'Kỹ năng IELTS'),h('p',{},'Bốn kỹ năng của bài thi IELTS. Nội dung sẽ được cô Trâm cập nhật dần.')),
      h('div',{class:'modgrid'},...MODULES.filter(m=>['nghe','doc','noi','viet'].includes(m.id)).map(card))),
    h('section',{class:'sheet'},h('h3',{},'Lộ trình gợi ý 6 tuần'),h('p',{class:'note'},'Mỗi ngày 20–30 phút: 10 phút phát âm, 10 phút từ vựng, 10 phút ngữ pháp.'),
      h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Thời gian'),h('th',{},'Phát âm'),h('th',{},'Từ vựng'),h('th',{},'Ngữ pháp'))),
        h('tbody',{},...PLAN.map(r=>h('tr',{},h('td',{style:'font-weight:700;white-space:nowrap'},r[0]),...r.slice(1).map(c=>h('td',{},c.replace(/^[^:]+: /,'')))))))))
  );
});
</script>
</body>
</html>
